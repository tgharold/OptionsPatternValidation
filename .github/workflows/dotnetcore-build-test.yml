name: .NET Core

on:

  push:
    branches: [ master ]

  pull_request:
    branches: [ master ]

jobs:

  # note: changing build/name breaks the branch protection
  build:
    name: Build-Test

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2

    - name: Setup .NET
      uses: actions/setup-dotnet@871f041373faaad213a635d9afb62905ec029bbb # v1
      with:
        dotnet-version: 8.0.204
        
    - name: Build with dotnet
      run: dotnet build --configuration Release

    - name: Run unit tests
      run: dotnet test --configuration Release
